<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Locked</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <style>
            :root {
                --ink: #141b2e;
                --slab: #1d2740;
                --edge: #2c3856;
                --paper: #f3f0e7;
                --mute: #8492b4;
                --signal: #e8a13a;
                --flag: #d0645a;
                --ui: "Space Grotesk",system-ui,sans-serif;
                --mono: "IBM Plex Mono",ui-monospace,monospace;
            }

            * {
                box-sizing: border-box
            }

            html,body {
                margin: 0;
                padding: 0;
                height: 100%
            }

            body {
                background: var(--ink);
                color: var(--paper);
                font-family: var(--ui);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
            }

            .gate {
                width: 100%;
                max-width: 380px
            }

            h1 {
                font-size: 20px;
                font-weight: 700;
                letter-spacing: -.02em;
                margin: 0 0 4px
            }

            .sub {
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: .08em;
                text-transform: uppercase;
                color: var(--mute);
                margin-bottom: 22px;
            }

            label {
                display: block;
                font-family: var(--mono);
                font-size: 11px;
                letter-spacing: .09em;
                text-transform: uppercase;
                color: var(--mute);
                margin-bottom: 8px;
            }

            input {
                width: 100%;
                background: var(--slab);
                color: var(--paper);
                border: 1px solid var(--edge);
                border-radius: 3px;
                font-family: var(--mono);
                font-size: 14px;
                padding: 11px 12px;
            }

            input:focus {
                outline: 2px solid var(--signal);
                outline-offset: 1px
            }

            button {
                width: 100%;
                margin-top: 12px;
                font-family: var(--ui);
                font-size: 14px;
                font-weight: 700;
                padding: 11px 18px;
                border-radius: 3px;
                cursor: pointer;
                background: var(--signal);
                border: 1px solid var(--signal);
                color: #231703;
            }

            button:hover {
                background: #f0b055
            }

            button:disabled {
                opacity: .6;
                cursor: default
            }

            .msg {
                font-family: var(--mono);
                font-size: 12px;
                margin-top: 14px;
                min-height: 18px;
                color: var(--mute);
            }

            .msg.err {
                color: #f0a8a1
            }
        </style>
    </head>
    <body>
        <form class="gate" id="gate">
            <h1>Assessment payload decoder</h1>
            <div class="sub">locked · encrypted in the page</div>
            <label for="pw">Passphrase</label>
            <input type="password" id="pw" autocomplete="current-password" autofocus>
            <button type="submit" id="go">Unlock</button>
            <div class="msg" id="msg"></div>
        </form>

                var msg = document.getElementById("msg");
                var go = document.getElementById("go");

                function bytes(b64) {
                    var bin = atob(b64)
                      , out = new Uint8Array(bin.length);
                    for (var i = 0; i < bin.length; i++)
                        out[i] = bin.charCodeAt(i);
                    return out;
                }

                document.getElementById("gate").addEventListener("submit", function(e) {
                    e.preventDefault();
                    var pw = document.getElementById("pw").value;
                    if (!pw)
                        return;
                    if (!window.crypto || !crypto.subtle) {
                        msg.textContent = "This browser has no WebCrypto (needs https:// or localhost).";
                        msg.className = "msg err";
                        return;
                    }
                    go.disabled = false;
                    msg.className = "msg";
                    msg.textContent = "unlocking…";

                    crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base) {
                        return crypto.subtle.deriveKey({
                            name: "PBKDF2",
                            salt: bytes(PAYLOAD.salt),
                            iterations: PAYLOAD.iterations,
                            hash: "SHA-256"
                        }, base, {
                            name: "AES-GCM",
                            length: 256
                        }, false, ["decrypt"]);
                    }).then(function(key) {
                        return crypto.subtle.decrypt({
                            name: "AES-GCM",
                            iv: bytes(PAYLOAD.iv)
                        }, key, bytes(PAYLOAD.data));
                    }).then(function(plain) {
                        var html = new TextDecoder().decode(plain);
                        document.open();
                        document.write(html);
                        document.close();
                    }).catch(function() {
                        go.disabled = false;
                        msg.className = "msg err";
                        msg.textContent = "Wrong passphrase.";
                        document.getElementById("pw").select();
                    });
                });
            }
